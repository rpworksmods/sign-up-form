<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign up | Template</title>
</head>
<body>
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="title-bg">
            <img src="./assets/images/logo.png" alt="Logo" class="logo">
            <h1>ODIN</h1>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="header">
            <h2>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</h2>
            <h2>You <em>know</em> you want to.</h2>
        </div>

        <div class="form-container">
            <form action="" method="post" class="signup-form">
                <fieldset>
                    <legend>Let's do this!</legend>

                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" required>

                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="number">Phone Number</label>
                    <input type="tel" id="number" name="number" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </fieldset>
                <fieldset>
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <a href="">Log in</a></p>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
